          <div class="form-row">
            <label>
              <span>Preferred Date</span>
              <input type="date" name="preferred_date">
            </label>
            <label>
              <span>Preferred Time</span>
              <div class="preferred-time-picker" aria-label="Preferred time picker">
                <select data-time-part="hour" aria-label="Hour">
                  <option value="9">9</option>
                  <option value="10">10</option>
                  <option value="11">11</option>
                  <option value="12">12</option>
                  <option value="1">1</option>
                  <option value="2">2</option>
                  <option value="3">3</option>
                  <option value="4">4</option>
                  <option value="5">5</option>
                  <option value="6">6</option>
                  <option value="7">7</option>
                  <option value="8">8</option>
                </select>
                <span>:</span>
                <select data-time-part="minute" aria-label="Minutes">
                  <option value="00">00</option>
                  <option value="15">15</option>
                  <option value="30">30</option>
                  <option value="45">45</option>
                </select>
                <select data-time-part="period" aria-label="AM or PM">
                  <option value="AM">AM</option>
                  <option value="PM">PM</option>
                </select>
                <input type="hidden" name="preferred_time" value="9:00 AM">
              </div>
            </label>
          </div>
